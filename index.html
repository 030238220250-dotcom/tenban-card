<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thư mời sự kiện</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    img {
      max-width: 100%;
      border-radius: 10px;
    }
    h2 {
      color: #333;
    }
    #downloadBtn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Nhập tên để nhận thư mời</h2>
  <input type="text" id="nameInput" placeholder="Nhập tên của bạn">
  <button onclick="generateCard()">Xác nhận</button>

  <div id="invitation" class="card" style="display:none; margin-top:20px;">
    <h2 id="guestName"></h2>
    <p>Chúng tôi trân trọng mời bạn tham dự sự kiện đặc biệt.</p>
    <img src="thiep.jpg" alt="Thư mời">
    <p>Ngày: 15/10/2025<br>Địa điểm: TP.HCM</p>
    <button id="downloadBtn" onclick="downloadCard()">📥 Tải về thư mời</button>
  </div>

  <!-- Thư viện html2canvas để xuất ảnh -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    function generateCard() {
      let savedName = localStorage.getItem("guestName");
      if (savedName) {
        alert("Bạn đã nhập tên trước đó: " + savedName);
        document.getElementById("guestName").innerText = "Kính gửi " + savedName + ",";
        document.getElementById("invitation").style.display = "block";
        return;
      }

      let name = document.getElementById("nameInput").value.trim();
      if (!name) {
        alert("Vui lòng nhập tên!");
        return;
      }

      localStorage.setItem("guestName", name);
      document.getElementById("guestName").innerText = "Kính gửi " + name + ",";
      document.getElementById("invitation").style.display = "block";
    }

    function downloadCard() {
      const card = document.getElementById("invitation");
      html2canvas(card).then(canvas => {
        const link = document.createElement("a");
        link.download = "thu-moi.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    // Tự động hiển thị lại nếu đã nhập trước đó
    window.onload = () => {
      let savedName = localStorage.getItem("guestName");
      if (savedName) {
        document.getElementById("guestName").innerText = "Kính gửi " + savedName + ",";
        document.getElementById("invitation").style.display = "block";
      }
    }
  </script>
</body>
</html>
